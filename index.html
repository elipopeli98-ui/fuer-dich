<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ein kleines Rätsel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23b3192f' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap">
<style>
  :root {
    --nacht-1: #0b1430;
    --nacht-2: #1b2a55;
    --papier: #fffaf1;
    --papier-rand: #ecdcc0;
    --tinte: #3a2a22;
    --tinte-hell: #76625a;
    --rot: #b3192f;
    --rot-dunkel: #85101f;
    --gold: #d6a447;
    --gruen-hell: #eef6f0;
    --gruen-dunkel: #24513c;
  }

  * { box-sizing: border-box; }

  html { background: var(--nacht-1); }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--tinte);
    background: radial-gradient(130% 85% at 50% 0%, #2b3d72 0%, var(--nacht-2) 38%, var(--nacht-1) 100%) fixed;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #schnee { z-index: 0; }
  #konfetti { z-index: 3; }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
  }

  .testhinweis {
    margin: 0 0 18px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px dashed #c9a227;
    background: #fff3c4;
    color: #5b4500;
    font-size: 14px;
    line-height: 1.45;
    text-align: center;
  }

  .karte {
    position: relative;
    margin-top: 36px;
    padding: 54px 26px 28px;
    border-radius: 22px;
    background: var(--papier);
    box-shadow: 0 22px 60px rgba(0, 0, 0, .45);
    text-align: center;
  }
  .karte::before {
    content: "";
    position: absolute;
    inset: 9px;
    border: 1.5px dashed var(--papier-rand);
    border-radius: 15px;
    pointer-events: none;
  }

  .tuer {
    position: absolute;
    top: -36px;
    left: 50%;
    width: 72px;
    height: 72px;
    margin-left: -36px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 3px solid var(--gold);
    background: radial-gradient(circle at 35% 30%, #db2c43, var(--rot) 55%, var(--rot-dunkel));
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
    color: #fff;
    font: 700 28px/1 Georgia, "Times New Roman", serif;
  }
  .tuer svg { width: 32px; height: 32px; fill: #fff; }
  .pochen { animation: pochen 1.3s ease-in-out infinite; }

  .fuer {
    margin: 0 0 2px;
    color: var(--rot);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0 0 12px;
    font-family: "Dancing Script", Georgia, "Times New Roman", serif;
    font-size: 40px;
    font-weight: 700;
    line-height: 1.1;
    color: var(--tinte);
  }
  h1:focus { outline: none; }

  .einleitung {
    margin: 0 0 22px;
    color: var(--tinte-hell);
    font-size: 16px;
    line-height: 1.55;
  }

  .raetsel {
    margin: 0 0 22px;
    padding: 14px 16px;
    border-left: 4px solid var(--gold);
    border-radius: 10px;
    background: #fff2d9;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    line-height: 1.55;
    text-align: left;
    white-space: pre-line;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid var(--papier-rand);
    border-radius: 14px;
    outline: none;
    background: #fff;
    color: var(--tinte);
    font: inherit;
    font-size: 18px;
    text-align: center;
    transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder { color: #b5a596; }
  input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(214, 164, 71, .25);
  }

  button {
    padding: 14px 20px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, #d22c43, var(--rot));
    box-shadow: 0 6px 16px rgba(179, 25, 47, .35);
    color: #fff;
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
    transition: transform .1s, filter .2s;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px) scale(.99); }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  .rueckmeldung {
    min-height: 1.5em;
    margin: 16px 0 0;
    color: var(--rot);
    font-weight: 600;
    line-height: 1.45;
  }
  .rueckmeldung.neu { animation: rein .35s ease both; }
  .rueckmeldung.fast { color: #9a6200; }

  .tipp {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--gruen-hell);
    color: var(--gruen-dunkel);
    line-height: 1.45;
    text-align: left;
    animation: rein .5s ease both;
  }
  .tipp strong {
    display: block;
    margin-bottom: 2px;
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
  }

  .geloest { animation: rein .6s ease both; }
  .geloest h1 { color: var(--rot); font-size: 46px; }
  .nachricht {
    margin: 0;
    font-size: 17px;
    line-height: 1.6;
    white-space: pre-line;
  }

  .fusszeile {
    margin: 20px 0 0;
    color: rgba(255, 255, 255, .62);
    font-size: 13px;
    text-align: center;
  }

  .wackeln { animation: wackeln .45s ease; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @keyframes wackeln {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(3px); }
  }
  @keyframes rein {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes pochen {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.16); }
    30% { transform: scale(1); }
    45% { transform: scale(1.1); }
  }

  @media (max-width: 360px) {
    .karte { padding: 50px 18px 24px; }
    h1 { font-size: 34px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<canvas id="schnee" aria-hidden="true"></canvas>
<canvas id="konfetti" aria-hidden="true"></canvas>

<main>
  <p class="testhinweis" id="testhinweis" hidden></p>

  <section class="karte" id="karte" aria-labelledby="titel">
    <div class="tuer" id="tuer" aria-hidden="true"></div>
    <p class="fuer" id="fuer" hidden></p>
    <h1 id="titel"></h1>
    <p class="einleitung" id="einleitung"></p>
    <p class="raetsel" id="raetsel" hidden></p>

    <form id="formular" autocomplete="off" novalidate>
      <label class="sr-only" for="antwort">Deine Antwort</label>
      <input id="antwort" type="text" maxlength="200" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" enterkeyhint="go">
      <button type="submit" id="knopf"></button>
    </form>

    <p class="rueckmeldung" id="rueckmeldung" role="status" aria-live="polite"></p>
    <div id="tipps"></div>
  </section>

  <section class="karte geloest" id="geloest" aria-labelledby="geloestTitel" hidden>
    <div class="tuer" aria-hidden="true">
      <svg class="pochen" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
    <h1 id="geloestTitel" tabindex="-1"></h1>
    <p class="nachricht" id="nachricht"></p>
  </section>

  <p class="fusszeile" id="fusszeile"></p>
</main>

  // --- SHA-256 (eigene Umsetzung, damit es überall ohne Extras läuft) ---
  const K = new Uint32Array([
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
  ]);
  const START = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const ror = (x, n) => (x >>> n) | (x << (32 - n));

  function sha256(daten) {
    const laenge = daten.length;
    const gesamt = ((laenge + 9 + 63) >> 6) << 6;
    const m = new Uint8Array(gesamt);
    m.set(daten);
    m[laenge] = 0x80;
    const dv = new DataView(m.buffer);
    const bits = laenge * 8;
    dv.setUint32(gesamt - 8, Math.floor(bits / 0x100000000));
    dv.setUint32(gesamt - 4, bits >>> 0);

    const H = new Uint32Array(START);
    const W = new Uint32Array(64);
    for (let off = 0; off < gesamt; off += 64) {
      for (let t = 0; t < 16; t++) W[t] = dv.getUint32(off + t * 4);
      for (let t = 16; t < 64; t++) {
        const a = W[t - 15], b = W[t - 2];
        const s0 = ror(a, 7) ^ ror(a, 18) ^ (a >>> 3);
        const s1 = ror(b, 17) ^ ror(b, 19) ^ (b >>> 10);
        W[t] = W[t - 16] + s0 + W[t - 7] + s1;
      }
      let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (let t = 0; t < 64; t++) {
        const S1 = ror(e, 6) ^ ror(e, 11) ^ ror(e, 25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[t] + W[t]) | 0;
        const S0 = ror(a, 2) ^ ror(a, 13) ^ ror(a, 22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0;
        d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      H[0] += a; H[1] += b; H[2] += c; H[3] += d;
      H[4] += e; H[5] += f; H[6] += g; H[7] += h;
    }
    const aus = new Uint8Array(32);
    const adv = new DataView(aus.buffer);
    for (let i = 0; i < 8; i++) adv.setUint32(i * 4, H[i]);
    return aus;
  }

  const kodierer = new TextEncoder();
  const dekodierer = new TextDecoder();
  const hex = (bytes) => Array.from(bytes, (x) => x.toString(16).padStart(2, "0")).join("");
  const unhex = (s) => {
    const aus = new Uint8Array(s.length / 2);
    for (let i = 0; i < aus.length; i++) aus[i] = parseInt(s.substr(i * 2, 2), 16);
    return aus;
  };

  // --- Antworten vergleichbar machen ---
  // Groß/klein, Umlaute (ä = ae = a), ß = ss, Akzente, Leer- und Satzzeichen
  // spielen keine Rolle.
  function worte(text) {
    return String(text)
      .normalize("NFC")
      .toLowerCase()
      .replace(/ß/g, "ss")
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .split(/[^\p{L}\p{N}]+/u)
      .filter(Boolean);
  }
  const falte = (s) => s.replace(/ae/g, "a").replace(/oe/g, "o").replace(/ue/g, "u");

  // Die Lösung zählt auch, wenn sie in einer kurzen Antwort steckt,
  // z. B. „Wir waren auf dem Weihnachtsmarkt“ für „Weihnachtsmarkt“.
  const MAX_WORTE = 8;
  function kandidaten(text) {
    const w = worte(text);
    if (!w.length) return [];
    const menge = new Set([falte(w.join(""))]);
    if (w.length <= MAX_WORTE) {
      for (let i = 0; i < w.length; i++) {
        for (let j = i + 1; j <= w.length; j++) menge.add(falte(w.slice(i, j).join("")));
      }
    }
    return [...menge];
  }
  const schluessel = (antwort) => falte(worte(antwort).join(""));

  // --- Tippfehler-Toleranz ---
  // In der Seite stehen nur Prüfwerte von Varianten der Lösung, bei denen ein
  // paar Buchstaben fehlen. Hat die Eingabe eine gemeinsame Variante mit der
  // Lösung, zählt sie. So gehen fehlende, zusätzliche, vertauschte oder falsche
  // Buchstaben durch (z. B. „Weihnachtsmakt“ für „Weihnachtsmarkt“).
  const toleranz = (k) => (k.length >= 9 ? 2 : k.length >= 5 ? 1 : 0);
  const MAX_TOLERANZ = 2;
  const MAX_LAENGE_TOLERANZ = 32;

  // [ {s}, {s ohne 1 Buchstaben}, {s ohne 2 Buchstaben}, … ]
  function loeschungen(s, n) {
    const ebenen = [new Set([s])];
    for (let e = 1; e <= n; e++) {
      const naechste = new Set();
      for (const v of ebenen[e - 1]) {
        if (v.length < 2) continue;
        for (let i = 0; i < v.length; i++) naechste.add(v.slice(0, i) + v.slice(i + 1));
      }
      ebenen.push(naechste);
    }
    return ebenen;
  }

  // Alle Varianten der Eingabe → kleinste Zahl gelöschter Buchstaben.
  function eingabeVarianten(eingabe) {
    const ebeneVon = new Map();
    for (const k of kandidaten(eingabe)) {
      const ebenen = k.length <= MAX_LAENGE_TOLERANZ ? loeschungen(k, MAX_TOLERANZ) : [new Set([k])];
      ebenen.forEach((menge, e) => {
        for (const v of menge) {
          const bisher = ebeneVon.get(v);
          if (bisher === undefined || bisher > e) ebeneVon.set(v, e);
        }
      });
    }
    return ebeneVon;
  }

  // --- Prüfen und Ver-/Entschlüsseln ---
  const pruefwert = (salz, v) => hex(sha256(kodierer.encode("pruefen|" + salz + "|" + v)).subarray(0, 16));

  function strom(salz, k, laenge) {
    const aus = new Uint8Array(laenge);
    for (let block = 0, pos = 0; pos < laenge; block++) {
      const h = sha256(kodierer.encode("schluessel|" + salz + "|" + k + "|" + block));
      for (let i = 0; i < 32 && pos < laenge; i++) aus[pos++] = h[i];
    }
    return aus;
  }
  function verschluesseln(salz, k, text) {
    const daten = kodierer.encode(text);
    const s = strom(salz, k, daten.length);
    for (let i = 0; i < daten.length; i++) daten[i] ^= s[i];
    return hex(daten);
  }
  function entschluesseln(salz, k, h) {
    const daten = unhex(h);
    const s = strom(salz, k, daten.length);
    for (let i = 0; i < daten.length; i++) daten[i] ^= s[i];
    return dekodierer.decode(daten);
  }

  // Ergebnis: null (falsch) oder { art: "richtig" | "fast", text }.
  function pruefe(eingabe, geheim) {
    const nachPruefwert = new Map();
    for (const [v, e] of eingabeVarianten(eingabe)) nachPruefwert.set(pruefwert(geheim.salz, v), [v, e]);
    let bester = null;
    for (const s of geheim.schluessel) {
      const treffer = nachPruefwert.get(s.p);
      if (!treffer || treffer[1] > s.t) continue;
      const gruppe = geheim.gruppen[s.g];
      if (!bester || (gruppe.art === "richtig" && bester.gruppe.art !== "richtig")) {
        bester = { gruppe, v: treffer[0], k: s.k };
      }
    }
    if (!bester) return null;
    const inhaltsSchluessel = entschluesseln(geheim.salz, bester.v, bester.k);
    return { art: bester.gruppe.art, text: entschluesseln(geheim.salz, inhaltsSchluessel, bester.gruppe.inhalt) };
  }

  return { sha256, hex, worte, kandidaten, schluessel, toleranz, loeschungen, pruefwert, verschluesseln, entschluesseln, pruefe };
})();
// ==== KERN-ENDE ====

(() => {
  const E = EINSTELLUNGEN;
  const $ = (id) => document.getElementById(id);
  const reduziert = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const HERZ = '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

  // --- Merken (nur auf diesem Gerät; klappt das nicht, geht es auch ohne) ---
  const praefix = "raetsel:" + (GEHEIM ? GEHEIM.salz : "-") + ":";
  const speicher = {
    lesen(k) { try { return localStorage.getItem(praefix + k); } catch (_) { return null; } },
    schreiben(k, v) { try { localStorage.setItem(praefix + k, v); } catch (_) { /* egal */ } },
    loeschen() {
      try { ["geloest", "versuche"].forEach((k) => localStorage.removeItem(praefix + k)); } catch (_) { /* egal */ }
    },
  };
  if (location.hash === "#reset") {
    speicher.loeschen();
    try { history.replaceState(null, "", location.pathname + location.search); } catch (_) { /* egal */ }
  }

  // --- Texte einsetzen ---
  $("titel").textContent = E.titel;
  $("einleitung").textContent = E.einleitung;
  $("antwort").placeholder = E.platzhalter;
  $("knopf").textContent = E.knopf;
  $("geloestTitel").textContent = E.geloestTitel;
  $("fusszeile").textContent = E.fusszeile;
  if (E.name) { $("fuer").textContent = "Für " + E.name; $("fuer").hidden = false; }
  if (E.raetsel) { $("raetsel").textContent = E.raetsel; $("raetsel").hidden = false; }
  if (String(E.tuerchen).trim()) $("tuer").textContent = String(E.tuerchen).trim();
  else $("tuer").innerHTML = HERZ;

  if (!GEHEIM) {
    $("rueckmeldung").textContent = "Hier fehlt noch die Lösung (werkzeug/antwort-setzen.mjs).";
    $("formular").hidden = true;
    return;
  }
  if (GEHEIM.test) {
    $("testhinweis").textContent = "Vorschau: Die echte Lösung ist noch nicht eingetragen. Zum Ausprobieren tippe „" + GEHEIM.testAntwort + "“ ein.";
    $("testhinweis").hidden = false;
  }

  // --- Rätsel-Logik ---
  const karte = $("karte");
  const eingabe = $("antwort");
  const rueckmeldung = $("rueckmeldung");
  let versuche = parseInt(speicher.lesen("versuche"), 10) || 0;
  let letzteMeldung = -1;
  let gezeigteTipps = 0;

  function melde(text, art) {
    rueckmeldung.classList.remove("neu", "fast");
    void rueckmeldung.offsetWidth;
    rueckmeldung.textContent = text;
    rueckmeldung.classList.add("neu");
    if (art === "fast") rueckmeldung.classList.add("fast");
  }

  function wackeln() {
    karte.classList.remove("wackeln");
    void karte.offsetWidth;
    karte.classList.add("wackeln");
  }
  karte.addEventListener("animationend", () => karte.classList.remove("wackeln"));

  function tippsZeigen() {
    const faellig = E.tipps
      .filter((t) => t && t.text && versuche >= (t.abVersuch || 1))
      .sort((a, b) => (a.abVersuch || 1) - (b.abVersuch || 1));
    while (gezeigteTipps < faellig.length) {
      const box = document.createElement("div");
      box.className = "tipp";
      const kopf = document.createElement("strong");
      kopf.textContent = faellig.length > 1 ? "Tipp " + (gezeigteTipps + 1) : "Kleiner Tipp";
      box.appendChild(kopf);
      box.appendChild(document.createTextNode(faellig[gezeigteTipps].text));
      $("tipps").appendChild(box);
      gezeigteTipps++;
    }
  }

  function geloest(nachricht, frisch) {
    $("nachricht").textContent = nachricht;
    karte.hidden = true;
    $("geloest").hidden = false;
    $("geloestTitel").focus({ preventScroll: true });
    if (frisch) konfetti();
  }

  $("formular").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const wert = eingabe.value;
    if (!KERN.worte(wert).length) {
      melde(E.leer);
      wackeln();
      eingabe.focus();
      return;
    }
    const ergebnis = KERN.pruefe(wert, GEHEIM);
    if (ergebnis && ergebnis.art === "richtig") {
      eingabe.blur();
      speicher.schreiben("geloest", ergebnis.text);
      geloest(ergebnis.text, true);
      return;
    }
    versuche++;
    speicher.schreiben("versuche", String(versuche));
    if (ergebnis) {
      melde(ergebnis.text, "fast");
    } else {
      let i = Math.floor(Math.random() * E.falsch.length);
      if (E.falsch.length > 1 && i === letzteMeldung) i = (i + 1) % E.falsch.length;
      letzteMeldung = i;
      melde(E.falsch[i]);
      wackeln();
    }
    tippsZeigen();
    eingabe.select();
  });

  const gemerkt = speicher.lesen("geloest");
  if (gemerkt) geloest(gemerkt, false);
  else tippsZeigen();

  // --- Schnee ---
  (function schnee() {
    const c = $("schnee");
    const ctx = c.getContext("2d");
    if (!ctx) return;
    let w = 0, h = 0, zuletzt = 0;
    const flocken = [];
    const neu = (irgendwo) => ({
      x: Math.random() * w,
      y: irgendwo ? Math.random() * h : -8,
      r: 0.8 + Math.random() * 2.4,
      v: 0.25 + Math.random() * 0.7,
      d: Math.random() * Math.PI * 2,
      a: 0.35 + Math.random() * 0.55,
    });
    function groesse() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = c.clientWidth; h = c.clientHeight;
      c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const anzahl = Math.round(Math.min(130, (w * h) / 8000));
      while (flocken.length < anzahl) flocken.push(neu(true));
      flocken.length = anzahl;
      if (reduziert) zeichnen();
    }
    function zeichnen() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#fff";
      for (const f of flocken) {
        ctx.globalAlpha = f.a;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    function schritt(t) {
      const dt = zuletzt ? Math.min(3, (t - zuletzt) / 16.67) : 1;
      zuletzt = t;
      for (const f of flocken) {
        f.d += 0.012 * dt;
        f.y += f.v * (0.6 + f.r / 3) * dt;
        f.x += Math.sin(f.d) * 0.35 * dt;
        if (f.y > h + 8) Object.assign(f, neu(false));
        if (f.x > w + 8) f.x = -8; else if (f.x < -8) f.x = w + 8;
      }
      zeichnen();
      requestAnimationFrame(schritt);
    }
    window.addEventListener("resize", groesse);
    groesse();
    if (!reduziert) requestAnimationFrame(schritt);
  })();

  // --- Herzen-Konfetti, wenn sie es gelöst hat ---
  function konfetti() {
    if (reduziert) return;
    const c = $("konfetti");
    const ctx = c.getContext("2d");
    if (!ctx) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = c.clientWidth, h = c.clientHeight;
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const farben = ["#e0314b", "#ff6f91", "#ffb3c6", "#d6a447", "#f3d27a", "#ffffff"];
    const teile = [];

    function salve(anzahl, x, y, streuung) {
      for (let i = 0; i < anzahl; i++) {
        const winkel = -Math.PI / 2 + (Math.random() - 0.5) * streuung;
        const tempo = 6 + Math.random() * 10;
        const z = Math.random();
        teile.push({
          x: x + (Math.random() - 0.5) * 30, y,
          vx: Math.cos(winkel) * tempo, vy: Math.sin(winkel) * tempo,
          g: 0.2 + Math.random() * 0.08,
          s: 8 + Math.random() * 10,
          rot: Math.random() * Math.PI * 2,
          vr: (Math.random() - 0.5) * 0.2,
          farbe: farben[Math.floor(Math.random() * farben.length)],
          form: z < 0.55 ? "herz" : z < 0.8 ? "stern" : "punkt",
          alter: 0,
        });
      }
    }
    function herz(s) {
      const k = s / 2;
      ctx.beginPath();
      ctx.moveTo(0, k * 0.9);
      ctx.bezierCurveTo(-k * 1.7, -k * 0.15, -k * 0.75, -k * 1.45, 0, -k * 0.5);
      ctx.bezierCurveTo(k * 0.75, -k * 1.45, k * 1.7, -k * 0.15, 0, k * 0.9);
      ctx.closePath();
    }
    function stern(r) {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const rr = i % 2 ? r * 0.45 : r;
        const a = -Math.PI / 2 + (i * Math.PI) / 5;
        ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
    }

    salve(150, w / 2, h * 0.62, Math.PI * 0.8);
    setTimeout(() => { salve(60, w * 0.15, h, Math.PI * 0.35); salve(60, w * 0.85, h, Math.PI * 0.35); }, 450);

    let zuletzt = 0;
    function schritt(t) {
      const dt = zuletzt ? Math.min(3, (t - zuletzt) / 16.67) : 1;
      zuletzt = t;
      ctx.clearRect(0, 0, w, h);
      let lebendig = 0;
      for (const p of teile) {
        p.alter += dt;
        p.vy += p.g * dt;
        p.vx *= Math.pow(0.985, dt);
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        const alpha = Math.min(1, Math.max(0, 1 - (p.alter - 110) / 70));
        if (alpha <= 0 || p.y > h + 40) continue;
        lebendig++;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.farbe;
        if (p.form === "herz") herz(p.s);
        else if (p.form === "stern") stern(p.s * 0.55);
        else { ctx.beginPath(); ctx.arc(0, 0, p.s * 0.22, 0, Math.PI * 2); }
        ctx.fill();
        ctx.restore();
      }
      if (lebendig || teile.length < 270) requestAnimationFrame(schritt);
      else ctx.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(schritt);
  }
})();
